name: Caliper

options:
  bundleIdPrefix: com.olegklimakov
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  minimumXcodeGenVersion: "2.38.0"

packages:
  CaliperCore:
    path: Packages/CaliperCore
  CaliperHistory:
    path: Packages/CaliperHistory
  # Pinned exactly, not `from:` — the .xcodeproj (and with it Package.resolved)
  # is generated and gitignored, so a range would let every clone resolve a
  # different Sparkle, and Scripts/sparkle_tools.sh hands out whichever tools
  # that clone happened to fetch.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

settings:
  base:
    # Swift 6 language mode implies complete strict concurrency.
    SWIFT_VERSION: "6.0"
    ARCHS: arm64
    ENABLE_APP_SANDBOX: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Local builds are ad-hoc signed, so anyone can clone this and build it
    # without a certificate.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    # And therefore *not* hardened, which is the half of that sentence this
    # file used to claim and not do. Hardened runtime turns on library
    # validation, and library validation refuses a framework that is not signed
    # by the app's team — which the embedded Sparkle never is: it arrives from
    # the package artifact ad-hoc signed by the Sparkle project, and only
    # Scripts/release.sh re-signs it. The result was a Release build that dyld
    # killed at launch, intermittently enough to read as a crash:
    #
    #   Library not loaded: @rpath/Sparkle.framework/Versions/B/Sparkle
    #   ... mapping process and mapped file (non-platform) have different Team IDs
    #
    # The archive turns it back on, where the whole bundle carries one Developer
    # ID and notarization requires it. Set there rather than here so that the
    # build everyone runs is the build that works.
    ENABLE_HARDENED_RUNTIME: NO
  configs:
    # Everything else in Debug/Release comes from XcodeGen's presets; dead code
    # stripping is the one shipped-binary setting they leave off.
    release:
      DEAD_CODE_STRIPPING: YES

targets:
  Caliper:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: assets/icon/AppIcon.icns
        buildPhase: resources
    dependencies:
      - package: CaliperCore
        product: CaliperCore
      - package: CaliperHistory
        product: CaliperHistory
      - package: Sparkle
    settings:
      base:
        PRODUCT_NAME: Caliper
        PRODUCT_BUNDLE_IDENTIFIER: com.olegklimakov.caliper
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_ENTITLEMENTS: App/Caliper.entitlements
    info:
      path: App/Info.plist
      properties:
        # Menu bar accessory: no Dock icon, no main window.
        LSUIElement: true
        CFBundleDisplayName: Caliper
        CFBundleIconFile: AppIcon
        # XcodeGen defaults these to 1.0/1 instead of the version settings.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The appcast Sparkle polls. GitHub redirects /releases/latest/download/
        # to the newest release's asset, so the URL never changes — but a
        # release marked "pre-release" is skipped by /latest. The feed lives in
        # the public repository rather than this one, so an installed copy keeps
        # updating whatever happens to the source.
        SUFeedURL: https://github.com/olegklimakov/caliper/releases/latest/download/appcast.xml
        # Public half of the EdDSA key pair that signs updates; the private half
        # lives in the release manager's login Keychain, created once with
        # `"$(Scripts/sparkle_tools.sh)/generate_keys"` (-p prints this value
        # again). Replacing it strands every installed copy, since they only
        # accept updates signed by the key they shipped with.
        #
        # One key for every app this account ships, which is what Sparkle
        # advises: the tool stores a single key per Keychain and says so. The
        # cost is a shared blast radius; the benefit is one secret to keep
        # rather than one per app, and a secret nobody can find is as lost as
        # one nobody kept.
        SUPublicEDKey: BPrTisY3ZaEybRKiAlQbOkUR5zUiu39dA4VM7eGf6bQ=

schemes:
  Caliper:
    build:
      targets:
        Caliper: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
